; ===============================================
; CyberCalendar 6.0 - Month / Week / Day, dark blue theme
; Файл сгенерирован из шаблона, но редактируется руками как обычный .ini
; ===============================================

[Rainmeter]
Update=10000
BackgroundMode=2
SolidColor=0,0,0,0
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=CyberCalendar
Author=Assistant
Version=6.0
Information=Google Calendar skin with Month / Week / Day tabs

[Variables]
@Include=#@#Variables.inc
; 0 = неделя начинается с воскресенья, 1 = с понедельника
WeekStart=1
; окно дня для поиска свободного времени (часы) и минимальная длина окна (минуты)
DayStart=8
DayEnd=22
MinGap=30
; окна свободного времени длиннее этого (минуты) не показываем: это скорее всего сон
MaxFreeGap=480

; --- Палитра: один тёмный сине-графитовый тон + один мягкий синий акцент ---
ColorBG=16,18,26,245
ColorSurface=30,34,50,255
ColorSurface2=44,50,72,255
ColorBorder=255,255,255,30
ColorText=246,248,253,255
ColorTextSub=182,189,208,255
ColorDim=130,138,160,255
ColorAccent=125,166,255,255
ColorAccentSoft=125,166,255,55
ColorAccentLine=125,166,255,110
ColorOnAccent=14,17,28,255
ColorTag1=125,166,255,255
ColorTag2=108,214,200,255
ColorFreeFill=125,166,255,20

FontFace=Segoe UI
FontFaceTitle=Segoe UI Semibold

; цвета кнопок (меняются при наведении)
PrevFill=#ColorSurface#
NextFill=#ColorSurface#
TodayFill=#ColorSurface#
PickPrevFill=#ColorSurface2#
PickNextFill=#ColorSurface2#

; ===============================================
; Данные
; ===============================================

[MeasureCalendarScript]
Measure=Script
ScriptFile=#@#Calendar.lua
UpdateDivider=1

[MeasureEventParser]
Measure=WebParser
URL=#GoogleCalendarICS1#
RegExp=(?s)^(.*)$
UpdateRate=30
FinishAction=[!UpdateMeasure MeasureCalendarScript][!UpdateMeter *][!Redraw]

[MeasureEventParser2]
Measure=WebParser
URL=#GoogleCalendarICS2#
RegExp=(?s)^(.*)$
UpdateRate=30
FinishAction=[!UpdateMeasure MeasureCalendarScript][!UpdateMeter *][!Redraw]

; ===============================================
; Стили (общие настройки, чтобы не копировать их в каждый метр)
; ===============================================

[StDyn]
DynamicVariables=1
AntiAlias=1

[StText]
FontFace=#FontFace#
FontSize=10
FontColor=#ColorText#
StringAlign=LeftCenter
ClipString=1
H=16

[StSub]
FontFace=#FontFace#
FontSize=9
FontColor=#ColorTextSub#
StringAlign=LeftCenter
ClipString=1
H=16

[StCenter]
FontFace=#FontFace#
StringAlign=CenterCenter

[StLink]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorDim#

[MeterBG]
Meter=Shape
MeterStyle=StDyn
X=0
Y=0
Shape=Rectangle 0,0,400,[&MeasureCalendarScript:PanelH()],22 | Fill Color #ColorBG# | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterPrev]
Meter=Shape
MeterStyle=StDyn
X=20
Y=22
Shape=Rectangle 0,0,34,34,12 | Fill Color #PrevFill# | StrokeWidth 1 | Stroke Color #ColorBorder#
Shape2=Path Chev | StrokeWidth 2 | Stroke Color #ColorTextSub# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
Chev=20,11 | LineTo 14,17 | LineTo 20,23
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "PrevPeriod()"][!UpdateMeter *][!Redraw]
MouseOverAction=[!SetVariable PrevFill #ColorSurface2#][!UpdateMeter MeterPrev][!Redraw]
MouseLeaveAction=[!SetVariable PrevFill #ColorSurface#][!UpdateMeter MeterPrev][!Redraw]

[MeterNext]
Meter=Shape
MeterStyle=StDyn
X=346
Y=22
Shape=Rectangle 0,0,34,34,12 | Fill Color #NextFill# | StrokeWidth 1 | Stroke Color #ColorBorder#
Shape2=Path Chev | StrokeWidth 2 | Stroke Color #ColorTextSub# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
Chev=14,11 | LineTo 20,17 | LineTo 14,23
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "NextPeriod()"][!UpdateMeter *][!Redraw]
MouseOverAction=[!SetVariable NextFill #ColorSurface2#][!UpdateMeter MeterNext][!Redraw]
MouseLeaveAction=[!SetVariable NextFill #ColorSurface#][!UpdateMeter MeterNext][!Redraw]

[MeterTitle]
Meter=String
MeterStyle=StDyn | StCenter
X=200
Y=32
W=270
H=26
Text=[&MeasureCalendarScript:GetTitle()]
FontSize=17
FontFace=#FontFaceTitle#
FontColor=#ColorText#
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "ToggleMonthPicker()"][!UpdateMeter *][!Redraw]
MouseOverAction=[!SetOption MeterTitle FontColor "#ColorAccent#"][!UpdateMeter MeterTitle][!Redraw]
MouseLeaveAction=[!SetOption MeterTitle FontColor "#ColorText#"][!UpdateMeter MeterTitle][!Redraw]

